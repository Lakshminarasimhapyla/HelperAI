<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>HelperAI Chat</title>
  <style>
    body {
      margin: 0;
      background: #070b16;
      color: #f8fafc;
      font-family: Inter, Arial, sans-serif;
    }

    .boot-fallback {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .boot-fallback div {
      max-width: 520px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      padding: 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    .boot-fallback code {
      display: inline-block;
      margin-top: 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 12px;
      color: #67e8f9;
    }
  </style>
</head>
<body>
  <div id="root">
    <main class="boot-fallback">
      <div>
        <h1>HelperAI Chat</h1>
        <p>If this stays on screen, run the app with Vite instead of opening index.html directly.</p>
        <code>npm run dev</code>
      </div>
    </main>
  </div>
  <noscript>You need JavaScript enabled to run this app.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
